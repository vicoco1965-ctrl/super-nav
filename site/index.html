<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b52">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>ניווט בסופר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one narrow phone column. Top: the list. Then the route: map + a shelf-tag card for the current stop + big hands-free controls. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --fg:#14231d; --muted:#5b6b64; --line:#d5ded9;
  --accent:#0f6b52; --accent-fg:#ffffff; --tag:#ffd84a; --tag-fg:#1c1a0e; --warn:#b5481d;
  --shelf:#c9d6cf; --floor:#fbfcfb; --zone:#e4efe9; --route:#0f6b52; --done:#9fb3aa; --now:#d62839; --now-fg:#ffffff;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#17221e; --fg:#e6efe9; --muted:#9db0a7; --line:#2b3a34;
  --accent:#3fbf95; --accent-fg:#06140f; --tag:#f2cc3c; --tag-fg:#1c1a0e; --warn:#ff8c5a;
  --shelf:#34463f; --floor:#131d19; --zone:#1d2d27; --route:#3fbf95; --done:#4d625a; --now:#ff5a64; --now-fg:#1a0004; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#17221e; --fg:#e6efe9; --muted:#9db0a7; --line:#2b3a34;
  --accent:#3fbf95; --accent-fg:#06140f; --tag:#f2cc3c; --tag-fg:#1c1a0e; --warn:#ff8c5a;
  --shelf:#34463f; --floor:#131d19; --zone:#1d2d27; --route:#3fbf95; --done:#4d625a; --now:#ff5a64; --now-fg:#1a0004; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.1;text-wrap:balance}
.store{color:var(--muted);font-size:15px}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:12px 16px;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:focus-visible,.btn:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grow{flex:1 1 140px}
button[disabled]{opacity:.5;cursor:default}
textarea{font:inherit;width:100%;min-height:96px;border-radius:10px;border:1px solid var(--line);background:var(--floor);color:var(--fg);padding:10px;resize:vertical}
.note{font-size:14px;color:var(--muted);margin:0}
.example{font-size:13px;font-weight:700;color:var(--tag-fg);background:var(--tag);border-radius:6px;padding:1px 8px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.items li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.items .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.items select{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--floor);color:var(--fg);padding:4px 6px;max-width:55%}
.items li.unknown select{border-color:var(--warn);color:var(--warn)}
.status{font-size:15px;min-height:1.5em;margin:0}
.status.err{color:var(--warn)}
/* Shelf-tag card */
.tag{background:var(--tag);color:var(--tag-fg);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tag .num{grid-row:span 2;font-family:var(--display);font-size:46px;line-height:1;min-width:56px;text-align:center;border-left:2px dashed rgba(0,0,0,.25);padding-left:12px;font-variant-numeric:tabular-nums}
.tag .where{font-family:var(--display);font-size:22px;line-height:1.2}
.tag .turn{font-size:16px;font-weight:600}
.tag .take{grid-column:1/-1;font-size:18px;font-weight:700;border-top:1px solid rgba(0,0,0,.2);padding-top:8px;margin-top:4px}
.progress{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bignext{font-size:22px;min-height:68px}
.map{width:100%;max-width:100%;height:auto;display:block;border-radius:10px;background:var(--floor);border:1px solid var(--line)}
.map text{font-family:var(--body);font-size:11px;fill:var(--fg)}
.map .lbl{font-weight:700}
.map .zone{fill:var(--zone);stroke:var(--line)}
.map .zone.on{fill:var(--tag);stroke:var(--now);stroke-width:2.5}
.map .shelf{fill:var(--shelf)}
.map .route{fill:none;stroke:var(--done);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:2 6;opacity:.7}
.map .leg{fill:none;stroke:var(--now);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.map .stop{fill:var(--surface);stroke:var(--route);stroke-width:2}
.map .stop.done{fill:var(--done);stroke:var(--done)}
.map .stop.cur{fill:var(--now);stroke:var(--now-fg);stroke-width:2.5}
.map .stopn.cur{fill:var(--now-fg)}
.map .stop{opacity:1}
.map .stop.later{stroke:var(--done)}
.map .stopn{font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--fg)}
.map .zone.est{stroke-dasharray:4 3;stroke:var(--muted)}
.map .zone.promo{fill:var(--floor);stroke-dasharray:2 3;stroke:var(--muted)}
.map .aisletxt{font-size:9.5px;fill:var(--muted)}
.map .aisletxt.est{fill:var(--warn)}
.map .here{fill:#2f7fe0;stroke:#ffffff;stroke-width:2.5}
.map .herering{fill:none;stroke:#2f7fe0;stroke-width:2;opacity:.5}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;inset-inline-start:0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.pick button{min-height:48px;padding:6px;font-size:17px}
.pick .wide{grid-column:span 2;font-size:15px}
/* ---- Navigation screen: one big instruction on top, the map fills the rest, extras in a drawer ---- */
.nav{display:flex;flex-direction:column;gap:0}
body.navmode{overflow:hidden}
body.navmode #listPanel, body.navmode header{display:none}
body.navmode .nav{position:fixed;inset:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.navtop{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;background:var(--bg);border-bottom:1px solid var(--line)}
.navbar1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{min-height:40px;min-width:44px;padding:4px 10px;font-size:18px}
.icon[aria-pressed="true"]{background:var(--now);color:var(--now-fg);border-color:var(--now)}
.nav .tag{padding:10px 12px;gap:2px 12px}
.nav .tag .num{font-size:40px;min-width:50px}
.nav .tag .where{font-size:21px}
.nav .tag .take{font-size:19px;padding-top:6px;margin-top:2px}
.mapwrap{position:relative;flex:1 1 auto;min-height:0;background:var(--floor)}
.mapwrap .map{width:100%;height:100%;border:0;border-radius:0;max-width:100%}
.floatbtn{position:absolute;top:10px;inset-inline-start:10px;min-height:38px;padding:4px 12px;font-size:14px;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.bubble{position:absolute;inset-inline:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:4px;font-size:16px}
#bubbleYou{color:var(--muted);font-size:14px}
#bubbleMe{font-weight:700}
.navbottom{padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:6px;max-height:60%;overflow:auto}
.ctrl{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px}
.ctrl button{min-height:60px;font-size:19px}
.ctrl #finishBtn{grid-column:3}
.talk{flex-direction:column;gap:0;font-size:17px;background:var(--surface);border:2px solid var(--accent)}
.talk .mic{font-size:24px;line-height:1}
.talk.on{background:var(--now);color:var(--now-fg);border-color:var(--now)}
.talk.busy{opacity:.75}
@media (prefers-reduced-motion:no-preference){.talk.on{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.04)}}}
.nav .live{margin:0;text-align:center;font-size:14px}
.drawer{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.drawer summary{cursor:pointer;padding:12px;font-weight:700;list-style:none;min-height:44px}
.drawer summary::-webkit-details-marker{display:none}
.drawer[open]{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.drawer[open] summary{padding-inline:0}
.steps{margin:0;padding:0 22px 0 0;display:flex;flex-direction:column;gap:2px}
.steps li{padding:6px 4px;border-radius:8px;cursor:pointer}
.steps li.done{color:var(--muted);text-decoration:line-through}
.steps li.cur{background:var(--tag);color:var(--tag-fg);font-weight:700}
.steps li small{display:block;color:var(--muted);font-weight:400}
.steps li.cur small{color:var(--tag-fg)}
#addText{font:inherit;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--floor);color:var(--fg);padding:0 12px;min-width:0}
.appnote{margin:6px 0;padding:10px 12px;border-radius:12px;background:var(--tag);color:var(--tag-fg);font-size:15px;line-height:1.45}
.appnote button{margin-top:8px;min-height:40px;font-size:15px}
.map .wall{fill:none;stroke:var(--muted);stroke-width:2}
.hands{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.live{font-size:14px;color:var(--muted)}
.live b{color:var(--accent)}
.wa{background:#1f8f4e;color:#fff;border-color:#1f8f4e}
@media (prefers-reduced-motion:no-preference){.map .leg{animation:dash 1.2s linear infinite;stroke-dasharray:10 6}@keyframes dash{to{stroke-dashoffset:-16}}}
</style>

<div class="wrap">
  <header>
    <h1>ניווט בסופר</h1>
    <span class="store">יוחננוף באר שבע · טיוטת מפה</span>
  </header>

  <section class="panel" id="listPanel" aria-labelledby="listH">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2 id="listH">הרשימה שלך</h2>
      <span class="example" id="exampleBadge">רשימה לדוגמה</span>
    </div>
    <div class="row">
      <button class="primary grow" id="photoBtn" type="button" data-input="photo">📷 צלם רשימה</button>
      <button class="grow" id="photoGal" type="button" data-input="photoG">🖼️ תמונה מהגלריה</button>
      <input type="file" id="photo" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
      <input type="file" id="photoG" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">
      <button class="grow" id="pasteToggle" type="button">הקלד או הדבק מוואטסאפ</button>
      <button class="grow" id="sayListBtn" type="button">🎤 אמור את הרשימה</button>
    </div>
    <div id="pasteBox" hidden>
      <textarea id="listText" aria-label="רשימת קניות, פריט בכל שורה או מופרד בפסיקים" placeholder="חלב, לחם, עגבניות..."></textarea>
      <div class="row" style="margin-top:8px"><button class="primary grow" id="parseBtn" type="button">עדכן רשימה</button></div>
    </div>
    <p class="appnote" id="appNote" hidden></p>
    <p class="status" id="status" role="status"></p>
    <ul class="items" id="items"></ul>
    <p class="note" id="emptyNote">הרשימה ריקה. צלם, אמור או הקלד את רשימת הקניות. <button type="button" id="sampleBtn" style="min-height:0;padding:2px 8px;font-size:14px">נסה רשימה לדוגמה</button></p>
    <button class="primary bignext" id="startBtn" type="button">התחל ניווט ▸</button>
  </section>

  <section id="navPanel" class="nav" aria-label="ניווט" hidden>
    <div class="navtop">
      <div class="navbar1">
        <button id="exitNav" class="icon" type="button" aria-label="חזרה לרשימה">✕</button>
        <span class="progress" id="progress"></span>
        <button id="muteBtn" class="icon" type="button" aria-pressed="false" aria-label="השתק">🔊</button>
      </div>
      <div class="tag" id="tag" aria-live="polite">
        <div class="num" id="tagNum">1</div>
        <div class="where" id="tagWhere"></div>
        <div class="turn" id="tagTurn"></div>
        <div class="take" id="tagTake"></div>
      </div>
    </div>
    <div class="mapwrap">
      <svg class="map" id="map" viewBox="0 0 360 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="מפת סניף יוחננוף באר שבע עם המסלול"></svg>
      <button id="zoomBtn" class="floatbtn" type="button">🗺️ כל החנות</button>
      <div class="bubble" id="bubble" hidden><div id="bubbleYou"></div><div id="bubbleMe"></div></div>
    </div>
    <div class="navbottom">
      <div class="ctrl">
        <button id="prevBtn" type="button" aria-label="התחנה הקודמת">◂</button>
        <button id="talkBtn" class="talk" type="button" aria-label="דבר עם האפליקציה"><span class="mic">🎤</span><span id="talkLbl">דבר איתי</span></button>
        <button id="nextBtn" class="primary" type="button" aria-label="התחנה הבאה">הבא ▸</button>
        <button id="finishBtn" class="primary" type="button" hidden>🏁 סיום</button>
      </div>
      <p class="appnote" id="appNote2" hidden></p>
      <p class="live" id="live">לחץ "דבר איתי" ושאל: "איפה החלב?", "תוסיף ביצים", "מה הלאה?"</p>
      <details class="drawer" id="drawer">
        <summary>☰ כל התחנות ועוד אפשרויות</summary>
        <ol class="steps" id="steps"></ol>
        <div class="row">
          <button class="grow" id="repeatBtn" type="button">🔊 שוב</button>
          <button class="grow" id="addBtn" type="button">➕ הוסף פריט</button>
        </div>
        <div class="row" id="addBox" hidden>
          <input id="addText" class="grow" type="text" aria-label="מה להוסיף לרשימה" placeholder="למשל: טחינה">
          <button class="primary" id="addGo" type="button">הוסף</button>
        </div>
        <div class="row">
          <button class="grow" id="pickBtn" type="button" aria-expanded="false">🔢 אני במעבר...</button>
          <button class="grow" id="whereBtn" type="button" data-input="signPhoto">📷 צלם שלט (ניסיוני)</button>
        </div>
        <div id="pickBox" class="pick" hidden></div>
        <input type="file" id="signPhoto" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
        <p class="status" id="whereStatus" role="status"></p>
        <div class="row">
          <button class="grow" id="handsBtn" type="button">🎙️ ידיים חופשיות</button>
        </div>
        <div class="row">
          <a class="btn wa grow" id="waBtn" href="#" target="_blank" rel="noopener">שלח מסלול בוואטסאפ</a>
          <button class="grow" id="copyBtn" type="button">העתק מסלול</button>
        </div>
        <p class="note" id="voiceNote"></p>
        <p class="note" id="brainNote"></p>
      </details>
    </div>
  </section>
</div>

<script>
// ---------- Store map: Yochananof Be'er Sheva (built from Victor's description + aisle-sign photos) ----------
// Screen: entrance bottom-right. Walk up through the promo foyer and produce, greens fridge ahead,
// turn left to the main walkway with aisles 1..14. Back area (top): dairy in the right corner, then bakery,
// meat/fish deli along the back wall, low freezer rows opposite the deli. est = location not confirmed yet.
const SPINE = 135, RIGHT = 288, CONNECT = 458, BACK = 48, LEFT = 56;
const AY = i => 180 + (14 - i) * 20;              // row center of aisle i (1 = nearest the produce)
const SECTIONS = [
  {id:"produce", name:"פירות וירקות", short:"פירות וירקות", where:"מחלקת הפירות והירקות, ישר אחרי מבואת המבצעים", num:"🍅", order:1,
   rect:[230,482,115,108], stop:[RIGHT,540],
   kw:["עגבני","מלפפון","תפוח","בננ","בצל","שום","תפוחי אדמה","תפו\"א","גזר","לימון","פירות","ירקות","אבוקדו","פלפל","גמב","תפוז","ענבים","אבטיח","מלון","כרוב","קישוא","חציל","פטריות","תות","אגס","קלמנטינ","בטטה","פלפל חריף","צנון","סלק","קולרבי","דלעת","אפרסק","שזיף","מנגו","קיווי"]},
  {id:"greens", name:"מקרר עלים ירוקים", short:"עלים", where:"מקרר העלים הגדול, בקיר שממולך ובצד ימין", num:"🌿", order:2,
   rect:[230,446,115,26], stop:[RIGHT,470],
   kw:["כוסברה","פטרוזיליה","שמיר","נענע","חסה","בזיליקום","עלים","בצל ירוק","תרד","רוקט","עירית","סלרי","מנגולד"]},
  {id:"home", est:true, name:"כלי בית", short:"כלי בית ?", where:"מחלקת כלי הבית (מיקום משוער)", num:"🍳", order:4,
   rect:[70,478,145,70], stop:[SPINE,512],
   kw:["סיר","מחבת","כלי בית","סכו\"ם","סכום","קומקום","קרש חיתוך","סכין","מגבת","קופסאות אחסון","כוס זכוכית"]},
  {id:"nuts", name:"פיצוחים", short:"פיצוחים", where:"מחלקת הפיצוחים, בצד ימין", num:"🥜", order:3,
   rect:[300,128,45,30], stop:[RIGHT,143],
   kw:["פיצוחים","גרעינים","בוטנים","שקדים","אגוז","קשיו","פיסטוק","פקאן","פירות יבשים","צימוקים","תמרים","מיקס"]},
  {id:"dairy", name:"חלב, גבינות, ביצים וסלטים", short:"מקררי חלב", where:"מקררי החלב, צמודים לקיר מימינך ומולך", num:"🥛", order:4,
   rect:[222,14,123,24], side:[321,38,24,84], stop:[310,BACK],
   kw:["חלב","גבינ","קוטג","יוגורט","שמנת","חמאה","ביצ","לבנה","מעדן","מילקי","דני","בולגרית","צפתית","משקה סויה","סלט","חומוס","טחינה","מטבוחה","חציל במיונז","כרוב סלט","פודינג"]},
  {id:"ddeli", name:"מעדנייה חלבית", short:"מעדנייה חלבית", where:"המעדנייה החלבית, ממול מקררי החלב", num:"🧀", order:5,
   rect:[222,58,90,20], stop:[255,BACK],
   kw:["גבינה פרוסה","גבינה צהובה במשקל","גבינות במשקל","מעדנייה חלבית","גבינת עיזים","פטה","רוקפור","בריה","קממבר"]},
  {id:"bakery", name:"מאפייה", short:"מאפייה", where:"המאפייה, מימינך אחרי מחלקת החלב", num:"🥖", order:6,

$("talkBtn").addEventListener("click", async () => {

// What the app knows right now, for Claude
function routeState() {
  const st = stops.map((s, i) => `${i + 1}${i === cur ? " (current)" : i < cur ? " (done)" : ""}: ${s.end ? "checkouts" : s.section.id + " " + s.section.where + " -> " + s.items.join(", ")}`).join("\n");
  return `Route stops:\n${st}\nCustomer location: ${here ? here.id + " " + here.where : "unknown (walking toward the current stop)"}`;
}
const BRAIN_RULES = `You are the voice of a shopping navigation app inside the Yochananof supermarket in Be'er Sheva. The customer talks to you in Hebrew while walking with a phone. Understand what they want, choose app actions, and give a short spoken answer.

${SECTIONS.map(s => `${s.id} = ${s.name}, ${s.where}${s.est ? " (location not confirmed)" : ""}`).join("\n")}

{"type":"where","name":"<product>","section":"<id>"}  customer asks where something is, or wants it now: the app goes there next (adds it to the list if missing)
{"type":"add","items":[{"name":"<product>","section":"<id or null>"}]}  add to the list, placed at the best point of the route
{"type":"remove","name":"<product as in the list>"}
{"type":"next"} customer took the items or wants the next stop; {"type":"prev"}; {"type":"repeat"} repeat the current instruction
{"type":"locate","section":"<id>"} customer says where they are standing now ("אני במעבר 8", "אני ליד הלחם")
{"type":"mute"} / {"type":"unmute"}; {"type":"finish"} done shopping; {"type":"list"} read what is left
Rules: answer in natural spoken Hebrew, one or two short sentences, no lists or symbols. Talk to the customer in a neutral, friendly way. Only use section ids from the list. If you are not sure where a product is, pick the most likely section and say it is probably there. If the customer asks something unrelated to shopping in this store, answer very briefly. Do not invent prices or stock. If no action fits, use an empty actions list.

}
async function askClaude(text) {

  const user = `${routeState()}\n${past ? "Conversation so far:\n" + past + "\n" : ""}Customer now said: "${text}"`;
  if (sample) return parsePlan(await sample.json(BRAIN_RULES + "\n\n" + user, { modelTier: "quick" }));
  if (server.assist) {
    const r = await fetch("api/claude", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system: BRAIN_RULES, messages: [{ role: "user", content: user }], max_tokens: 400 }) });

// Simple rules when Claude is not available
function localBrain(text) {

  if (add) return { actions: [{ type: "add", items: splitList(add[1].replace(/\s+וגם\s+|\s+גם\s+/g, ",")).map(n => ({ name: n.replace(/^ה(?=..)/, m => startsKw(n) ? m : ""), section: null })) }] };

  if (rm) return { actions: [{ type: "remove", name: rm[1] }] };
  const ask = t.match(/^(?:איפה|איפוא|איפה יש|איפה נמצא(?:ת|ים|ות)?|איפה אני מוצא|אני צריך|אני צריכה|אני רוצה|תביא לי|תמצא לי|חפש|יש לכם|יש פה)\s+(.+)$/);

const cleanName = n => { n = String(n || "").replace(/[?؟!.]/g, "").trim(); if (n.length > 3 && n[0] === "ה" && !startsKw(n) && matchSection(n.slice(1))) n = n.slice(1); return n.slice(0, 40); };

// "ב" + place, without doubling the article: "המאפייה" -> "במאפייה"
const inPlace = w => "ב" + String(w).replace(/^ה(?=[א-ת])/, "");

// put an item on the route; goNow makes it the very next stop
function placeItem(name, sec, goNow) {
  if (!items.some(i => i.name === name && i.section === sec.id)) items.push({ name, section: sec.id });

async function runPlan(plan, text) {

        if (!sec) { notes.push(`לא מצאתי איפה יש ${name}`); continue; }

          if (already === cur) notes.push(`יש ${name} ${inPlace(sec.where)}, זו התחנה שאתה הולך אליה עכשיו`);

        } else { const n = placeItem(name, sec, false); notes.push(`הוספתי ${name}, ${inPlace(sec.where)}, ` + (n === cur ? "בתחנה שאתה הולך אליה עכשיו" : `תחנה ${n + 1}`)); }

      const hit = items.find(i => i.name === q) || items.find(i => i.name.includes(q) || q.includes(i.name));
      if (!hit) { notes.push(`${q} לא ברשימה`); continue; }

      notes.push(!left.length ? "לא נשאר כלום ברשימה, אפשר ללכת לקופות" : left.length <= 3 ? `נשארו ${left.length}: ${say3}` : `נשארו ${left.length} תחנות. הקרובות: ${say3}. את כל הרשימה רואים בתפריט למטה`);

async function converse(text) {
  talkState("think"); bubble(text, "…");

  if (!plan) plan = localBrain(text);
  try { await runPlan(plan, text); } finally { talkState("idle"); }
